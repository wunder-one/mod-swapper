[project]
name = "mod-swapper"
version = "0.3.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter==5.2.2",
    "pyinstaller==6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff.lint]
# Scratch scripts insert the repo root on sys.path before importing local packages.
per-file-ignores = { "scratch/*.py" = ["E402"] }
